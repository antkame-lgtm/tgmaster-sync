name: TgMaster Calendar Cloud Sync

on:
  schedule:
    # Exécution automatique 3 fois par jour (06h00, 12h00, 18h00 UTC)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Synchronisation du planning TgMaster
        env:
          TGMASTER_EMAIL: ${{ secrets.TGMASTER_EMAIL }}
          TGMASTER_PASSWORD: ${{ secrets.TGMASTER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node sync.js

      - name: Enregistrement des mises à jour sur GitHub
        run: |
          git config --global user.name "TgMaster Bot"
          git config --global user.email "bot@tgmaster.local"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync planning: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "Aucun changement détecté."
          fi
